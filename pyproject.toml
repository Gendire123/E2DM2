[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e2dm2"
version = "1.1.2"
description = "Easy Epic Drone Movie Maker desktop alpha"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]
build = [
    "Nuitka>=2.7,<3",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]

[project.scripts]
e2dm2 = "e2dm2.__main__:main"

[tool.setuptools]
packages = ["e2dm2"]
include-package-data = true

[tool.setuptools.package-data]
e2dm2 = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
