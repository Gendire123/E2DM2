[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e2dm2"
version = "0.1.0"
description = "Easy Epic Drone Movie Maker desktop alpha"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[project.scripts]
e2dm2 = "e2dm2.__main__:main"

[tool.setuptools]
packages = ["e2dm2"]
include-package-data = true

[tool.setuptools.package-data]
e2dm2 = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

