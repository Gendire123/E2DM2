name: Windows Build & SignPath Provenance

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chocolatey Dependencies (FFmpeg & Inno Setup)
        run: |
          choco install ffmpeg --version 8.1.2 -y
          choco install innosetup -y

      - name: Ensure FFmpeg License File Exists
        shell: powershell
        run: |
          $FfmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($FfmpegCmd) {
            $FfmpegBin = Split-Path $FfmpegCmd.Source -Parent
            $FfmpegRoot = Split-Path $FfmpegBin -Parent
            $LicenseFile = Join-Path $FfmpegRoot "LICENSE"
            if (-not (Test-Path -LiteralPath $LicenseFile)) {
              $AltLicense = Join-Path $FfmpegRoot "doc\LICENSE.txt"
              if (Test-Path -LiteralPath $AltLicense) {
                Copy-Item -LiteralPath $AltLicense -Destination $LicenseFile -Force
              } else {
                Set-Content -Path $LicenseFile -Value "FFmpeg is licensed under the LGPL/GPL license."
              }
            }
          }

      - name: Build Windows Executable & Installer
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\packaging\build_windows.ps1 -WorkRoot C:\E2DM2-build

      - name: Upload Unsigned Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E2DM2-Setup-Unsigned
          path: dist/E2DM2-Setup-*.exe
          if-no-files-found: error

